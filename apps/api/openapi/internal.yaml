  /api/workspaces/{slug}/projects/{project_id}/search-issues/:
    get:
      operationId: workspaces_projects_search_issues_list
      parameters:
      - in: query
        name: cycle
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true leaves out work items in a cycle
      - in: query
        name: has_children
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true lists only parents of other work items
      - in: query
        name: issue_id
        schema:
          type: string
        description: The work item the other flags relate to
      - in: query
        name: issue_relation
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true leaves out work items related to issue_id
      - in: query
        name: limit
        schema:
          type: integer
        description: 100 by default, at most 2000
      - in: query
        name: module
        schema:
          type: string
        description: Leaves out work items in this module
      - in: query
        name: parent
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true leaves out issue_id and its parent
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Matches the name and the sequence id
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: sub_issue
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true lists only root work items that can become sub-items of
          issue_id
      - in: query
        name: target_date
        schema:
          type: string
        description: none lists only work items without a target date
      - in: query
        name: workspace_search
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: true searches every project of the workspace
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkItemSearchResult'
          description: ''
