components:
  schemas:
    AccessEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Private
        * `1` - Public
    AnalyticView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        query:
          readOnly: true
        query_dict: {}
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          title: Last Modified By
        workspace:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - created_at
      - updated_at
      - deleted_at
      - name
      - description
      - query
      - query_dict
      - created_by
      - updated_by
      - workspace
    AnalyticViewRequest:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        query_dict: {}
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          title: Last Modified By
      required:
      - name
    BlankEnum:
      enum:
      - ''
