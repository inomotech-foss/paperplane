components:
  schemas:
    APIToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        deleted_at:
          type: string
          format: date-time
          nullable: true
        label:
          type: string
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
          readOnly: true
        last_used:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        token:
          type: string
          readOnly: true
        user_type:
          allOf:
          - $ref: '#/components/schemas/UserTypeEnum'
          readOnly: true
        expired_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          title: Last Modified By
        user:
          type: string
          format: uuid
          readOnly: true
        workspace:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - id
      - created_at
      - updated_at
      - deleted_at
      - label
      - description
      - is_active
      - last_used
      - token
      - user_type
      - expired_at
      - created_by
      - updated_by
      - user
      - workspace
    APITokenRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        deleted_at:
          type: string
          format: date-time
          nullable: true
        label:
          type: string
          maxLength: 255
        description:
          type: string
        last_used:
          type: string
          format: date-time
          nullable: true
        user_type:
          allOf:
