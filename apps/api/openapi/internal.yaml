    UserTypeEnum:
      enum:
      - 0
      - 1
      type: integer
      description: |-
        * `0` - Human
        * `1` - Bot
    UserWorkspaceDashboard:
      type: object
      properties:
        issue_activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityCount'
        completed_issues:
          type: array
          items:
            $ref: '#/components/schemas/CompletedIssueWeekInMonth'
        assigned_issues_count:
          type: integer
        pending_issues_count:
          type: integer
        completed_issues_count:
          type: integer
        issues_due_week_count:
          type: integer
        state_distribution:
          type: array
          items:
            $ref: '#/components/schemas/StateGroupCount'
        overdue_issues:
          type: array
          items:
            $ref: '#/components/schemas/OverdueIssue'
        upcoming_issues:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingIssue'
      required:
      - issue_activities
      - completed_issues
      - assigned_issues_count
      - pending_issues_count
      - completed_issues_count
      - issues_due_week_count
      - state_distribution
      - overdue_issues
      - upcoming_issues
    UserWorkspaceSettings:
      type: object
      properties:
        last_workspace_id:
          type: string
          format: uuid
          nullable: true
        last_workspace_slug:
          type: string
          nullable: true
        last_workspace_name:
          type: string
          description: Present when there is a last workspace
        last_workspace_logo:
          type: string
          description: Present when there is a last workspace
        fallback_workspace_id:
          type: string
          format: uuid
          nullable: true
        fallback_workspace_slug:
          type: string
          nullable: true
        invites:
          type: integer
      required:
      - last_workspace_id
      - last_workspace_slug
      - fallback_workspace_id
      - fallback_workspace_slug
      - invites
    VersionRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
        issue:
          type: string
          format: uuid
        last_saved_at:
          type: string
          format: date-time
        owned_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - workspace
      - project
      - issue
      - last_saved_at
      - owned_by
      - created_at
      - updated_at
      - created_by
      - updated_by
    ViewWorkItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        state_id:
          type: string
          format: uuid
          nullable: true
        sort_order:
          type: number
          format: double
        completed_at:
          type: string
          format: date-time
          nullable: true
        estimate_point:
          type: string
          format: uuid
          nullable: true
        priority:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        target_date:
          type: string
          format: date
          nullable: true
        sequence_id:
          type: integer
        project_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        cycle_id:
          type: string
          format: uuid
          nullable: true
        module_ids:
          type: array
          items:
            type: string
            format: uuid
        label_ids:
          type: array
          items:
