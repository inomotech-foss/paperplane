openapi: 3.0.3
info:
  title: Plane instance admin API
  version: 0.0.1
  description: Session-authenticated API used by the admin app. Not a stable public
    contract.
  contact:
    name: Plane
    url: https://plane.so
    email: support@plane.so
  license:
    name: GNU AGPLv3
    url: https://github.com/makeplane/plane/blob/preview/LICENSE.txt
paths:
  /api/instances/:
    get:
      operationId: root_retrieve
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          description: No response body
    patch:
      operationId: root_partial_update
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/instances/admins/:
    get:
      operationId: admins_list
      parameters:
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admins
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceAdmin'
          description: ''
    post:
      operationId: admins_create
      tags:
      - admins
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceAdmin'
          description: ''
  /api/instances/admins/{pk}/:
    delete:
      operationId: admins_destroy
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admins
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/instances/admins/me/:
    get:
      operationId: admins_me_retrieve
      tags:
      - admins
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceAdminMe'
          description: ''
  /api/instances/admins/session/:
    get:
      operationId: admins_session_retrieve
      tags:
      - admins
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceAdminSession'
          description: ''
  /api/instances/admins/sign-up-screen-visited/:
    post:
      operationId: admins_sign_up_screen_visited_create
      tags:
      - admins
      security:
      - sessionAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/instances/configurations/:
    get:
      operationId: configurations_retrieve
      tags:
      - configurations
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: configurations_partial_update
      tags:
      - configurations
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/instances/configurations/disable-email-feature/:
    delete:
      operationId: configurations_disable_email_feature_destroy
      tags:
      - configurations
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/instances/email-credentials-check/:
    post:
      operationId: email_credentials_check_create
      tags:
      - email-credentials-check
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/instances/oauth-applications/:
    get:
      operationId: oauth_applications_retrieve
      tags:
      - oauth-applications
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: oauth_applications_create
      tags:
      - oauth-applications
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
  /api/instances/oauth-applications/{pk}/:
    patch:
      operationId: oauth_applications_partial_update
      parameters:
      - in: path
        name: pk
        schema:
          type: integer
        required: true
      tags:
      - oauth-applications
      security:
      - sessionAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: oauth_applications_destroy
      parameters:
      - in: path
        name: pk
        schema:
          type: integer
        required: true
      tags:
      - oauth-applications
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/instances/users/:
    get:
      operationId: users_retrieve
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Pagination cursor for getting next set of results
        examples:
          NextPageCursor:
            value: '20:1:0'
            summary: Next page cursor
            description: 'Cursor format: ''page_size:page_number:offset'''
      - in: query
        name: per_page
        schema:
          type: integer
        description: 'Number of results per page (default: 20, max: 100)'
        examples:
          Default:
            value: 20
          Maximum:
            value: 100
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceUserList'
          description: ''
  /api/instances/users/{pk}/:
    get:
      operationId: users_retrieve_2
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserDetail'
          description: ''
    delete:
      operationId: users_destroy
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/instances/users/{pk}/deactivate/:
    post:
      operationId: users_deactivate_create
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserDeactivate'
          description: ''
  /api/instances/users/{pk}/merge/:
    post:
      operationId: users_merge_create
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserMerge'
          description: ''
  /api/instances/users/{pk}/merge/preview/:
    post:
      operationId: users_merge_preview_create
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserMerge'
          description: ''
  /api/instances/users/{pk}/reactivate/:
    post:
      operationId: users_reactivate_create
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - users
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceUserReactivate'
          description: ''
  /api/instances/workspace-slug-check/:
    get:
      operationId: workspace_slug_check_retrieve
      tags:
      - workspace-slug-check
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlugAvailability'
          description: ''
  /api/instances/workspaces/:
    get:
      operationId: workspaces_retrieve
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Pagination cursor for getting next set of results
        examples:
          NextPageCursor:
            value: '20:1:0'
            summary: Next page cursor
            description: 'Cursor format: ''page_size:page_number:offset'''
      - in: query
        name: per_page
        schema:
          type: integer
        description: 'Number of results per page (default: 20, max: 100)'
        examples:
          Default:
            value: 20
          Maximum:
            value: 100
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceWorkspaceList'
          description: ''
    post:
      operationId: workspaces_create
      tags:
      - workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/instances/workspaces/{pk}/:
    get:
      operationId: workspaces_retrieve_2
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
    delete:
      operationId: workspaces_destroy
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/instances/workspaces/{pk}/transfer-owner/:
    post:
      operationId: workspaces_transfer_owner_create
      parameters:
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - workspaces
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
components:
  schemas:
    InstanceAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_detail:
          allOf:
          - $ref: '#/components/schemas/UserAdminLite'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        deleted_at:
          type: string
          format: date-time
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          minimum: 0
          maximum: 2147483647
        is_verified:
          type: boolean
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
          title: Last Modified By
        user:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        instance:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - user_detail
      - created_at
      - updated_at
      - deleted_at
      - role
      - is_verified
      - created_by
      - updated_by
      - user
      - instance
    InstanceAdminMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        avatar:
          type: string
          readOnly: true
        avatar_url:
          type: string
          nullable: true
          readOnly: true
        cover_image:
          type: string
          format: uri
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Created At
        display_name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
          nullable: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_bot:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        user_timezone:
          allOf:
          - $ref: '#/components/schemas/UserTimezoneEnum'
          readOnly: true
        username:
          type: string
          readOnly: true
        is_password_autoset:
          type: boolean
          readOnly: true
      required:
      - id
      - avatar
      - avatar_url
      - cover_image
      - date_joined
      - display_name
      - email
      - first_name
      - last_name
      - is_active
      - is_bot
      - is_email_verified
      - user_timezone
      - username
      - is_password_autoset
    InstanceAdminSession:
      type: object
      properties:
        is_authenticated:
          type: boolean
        user:
          allOf:
          - $ref: '#/components/schemas/InstanceAdminMe'
          description: Present when signed in as an instance admin
      required:
      - is_authenticated
    InstanceUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_bot:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        merged_into:
          type: string
          format: uuid
          nullable: true
        is_instance_admin:
          type: boolean
        providers:
          type: array
          items:
            type: string
        workspace_count:
          type: integer
        last_login_time:
          type: string
          format: date-time
          nullable: true
        date_joined:
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - first_name
      - last_name
      - avatar_url
      - is_active
      - is_bot
      - deleted_at
      - merged_into
      - is_instance_admin
      - providers
      - workspace_count
      - last_login_time
      - date_joined
    InstanceUserDeactivate:
      type: object
      properties:
        sole_admin_workspaces:
          type: array
          items:
            type: string
          description: Slugs of the workspaces the user was the only admin of
        sole_admin_projects:
          type: array
          items:
            $ref: '#/components/schemas/SoleAdminProject'
        user:
          $ref: '#/components/schemas/InstanceUser'
      required:
      - sole_admin_workspaces
      - sole_admin_projects
      - user
    InstanceUserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_bot:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        merged_into:
          type: string
          format: uuid
          nullable: true
        is_instance_admin:
          type: boolean
        providers:
          type: array
          items:
            type: string
        workspace_count:
          type: integer
        last_login_time:
          type: string
          format: date-time
          nullable: true
        date_joined:
          type: string
          format: date-time
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUserMembership'
        owned_workspaces:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUserOwnedWorkspace'
      required:
      - id
      - email
      - display_name
      - first_name
      - last_name
      - avatar_url
      - is_active
      - is_bot
      - deleted_at
      - merged_into
      - is_instance_admin
      - providers
      - workspace_count
      - last_login_time
      - date_joined
      - memberships
      - owned_workspaces
    InstanceUserMembership:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: integer
        is_active:
          type: boolean
      required:
      - workspace_id
      - slug
      - name
      - role
      - is_active
    InstanceUserMerge:
      type: object
      properties:
        survivor:
          type: string
          format: uuid
        source:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Email of the surviving user after the merge
        relations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MergeCount'
          description: Rows moved and dropped, keyed by app.Model.field
      required:
      - survivor
      - source
      - email
      - relations
    InstanceUserOwnedWorkspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
      required:
      - id
      - slug
      - name
    InstanceUserReactivate:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/InstanceUser'
      required:
      - user
    MergeCount:
      type: object
      properties:
        moved:
          type: integer
        dropped:
          type: integer
      required:
      - moved
      - dropped
    PaginatedInstanceUserList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUser'
        grouped_by:
          allOf:
          - type: string
            nullable: true
            enum:
            - null
          nullable: true
        sub_grouped_by:
          allOf:
          - type: string
            nullable: true
            enum:
            - null
          nullable: true
        total_count:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string
        next_page_results:
          type: boolean
        prev_page_results:
          type: boolean
        count:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
        extra_stats:
          nullable: true
      required:
      - results
      - grouped_by
      - sub_grouped_by
      - total_count
      - next_cursor
      - prev_cursor
      - next_page_results
      - prev_page_results
      - count
      - total_pages
      - total_results
      - extra_stats
    PaginatedInstanceWorkspaceList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
        grouped_by:
          allOf:
          - type: string
            nullable: true
            enum:
            - null
          nullable: true
        sub_grouped_by:
          allOf:
          - type: string
            nullable: true
            enum:
            - null
          nullable: true
        total_count:
          type: integer
        next_cursor:
          type: string
        prev_cursor:
          type: string
        next_page_results:
          type: boolean
        prev_page_results:
          type: boolean
        count:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
        extra_stats:
          nullable: true
      required:
      - results
      - grouped_by
      - sub_grouped_by
      - total_count
      - next_cursor
      - prev_cursor
      - next_page_results
      - prev_page_results
      - count
      - total_pages
      - total_results
      - extra_stats
    PqlDialectEnum:
      enum:
      - jql
      - plane
      type: string
      description: |-
        * `jql` - JQL
        * `plane` - Plane
    RoleEnum:
      enum:
      - 20
      type: integer
      description: '* `20` - Admin'
    SlugAvailability:
      type: object
      properties:
        status:
          type: boolean
          description: True when the slug is free
      required:
      - status
    SoleAdminProject:
      type: object
      properties:
        workspace:
          type: string
          description: Workspace slug
        name:
          type: string
      required:
      - workspace
      - name
