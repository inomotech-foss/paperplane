    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          allOf:
          - $ref: '#/components/schemas/UserLite'
          readOnly: true
        logo_url:
          type: string
          readOnly: true
          nullable: true
        total_projects:
          type: integer
          readOnly: true
        total_members:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last Modified At
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          title: Workspace Name
          maxLength: 80
        logo:
          type: string
          nullable: true
        slug:
          type: string
          maxLength: 48
          pattern: ^[-a-zA-Z0-9_]+$
        organization_size:
          type: string
          nullable: true
          maxLength: 20
        timezone:
          $ref: '#/components/schemas/TimezoneEnum'
        background_color:
          type: string
          maxLength: 255
        pql_dialect:
          $ref: '#/components/schemas/PqlDialectEnum'
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          title: Last Modified By
        logo_asset:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - owner
      - logo_url
      - created_at
      - updated_at
      - deleted_at
      - name
      - logo
      - slug
      - organization_size
      - timezone
      - background_color
      - pql_dialect
      - created_by
      - updated_by
      - logo_asset
    WorkspaceRequest:
      type: object
      properties:
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          minLength: 1
          title: Workspace Name
          maxLength: 80
        logo:
          type: string
          nullable: true
        slug:
          type: string
          minLength: 1
          maxLength: 48
          pattern: ^[-a-zA-Z0-9_]+$
        organization_size:
          type: string
          nullable: true
          maxLength: 20
        timezone:
          $ref: '#/components/schemas/TimezoneEnum'
        background_color:
          type: string
          minLength: 1
          maxLength: 255
        pql_dialect:
          $ref: '#/components/schemas/PqlDialectEnum'
        logo_asset:
          type: string
          format: uuid
          nullable: true
      required:
      - name
      - slug
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: admin-session-id
