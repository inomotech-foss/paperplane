{{- if .Values.minio.local_setup }}

apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-minio
  labels:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
    {{- include "plane.commonLabels" $ | nindent 4 }}
spec:
  {{- if not .Values.minio.assign_cluster_ip }}
  clusterIP: None
  {{- end }}
  ports:
  - name: minio-api-9000
    port: 9000
    protocol: TCP
    targetPort: 9000
  - name: minio-console-9090
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-minio-wl
  {{- include "plane.labelsAndAnnotations" (dict "context" $ "values" .Values.minio) }}
spec:
  selector:
    matchLabels:
      app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
  serviceName:  {{ .Release.Name }}-minio
  template:
    metadata:
      labels:
        app.name: {{ .Release.Namespace }}-{{ .Release.Name }}-minio
        {{- include "plane.commonLabels" $ | nindent 8 }}
    spec:
      containers:
      - image: {{ .Values.minio.image }}
        imagePullPolicy: {{ .Values.minio.pullPolicy | default "IfNotPresent" }}
        name: {{ .Release.Name }}-minio
        stdin: true
        tty: true
        # The entrypoint chowns the data volume (which the old root-running
        # minio/minio image left root-owned) and then drops to the unprivileged
        # `minio` user, so it has to start as root.
        securityContext:
          runAsUser: 0
        env:
          # Created on start-up with the anonymous `download` policy, replacing the
          # former mc job.
          - name: MINIO_DEFAULT_BUCKETS
            value: {{ printf "%s:download" (.Values.env.docstore_bucket | default "uploads") | quote }}
          - name: MINIO_BROWSER
            value: "on"
          - name: MINIO_CONSOLE_PORT_NUMBER
            value: "9090"
        envFrom:
          - secretRef:
              name: {{ if not (empty .Values.external_secrets.doc_store_existingSecret) }}{{ .Values.external_secrets.doc_store_existingSecret }}{{ else }}{{ .Release.Name }}-doc-store-secrets{{ end }}
              optional: false
          {{- if .Values.secretGenerator.enabled }}
          - secretRef:
              name: {{ .Release.Name }}-generated-secrets
              optional: false
          {{- end }}
        volumeMounts:
        - mountPath: /bitnami/minio/data
          name: pvc-{{ .Release.Name }}-minio-vol
          subPath: ''
      {{- include "plane.podScheduling" .Values.minio }}
      serviceAccount: {{ .Release.Name }}-srv-account
      serviceAccountName: {{ .Release.Name }}-srv-account
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      creationTimestamp: null
      namespace: {{ .Release.Namespace }}
      name: pvc-{{ .Release.Name }}-minio-vol
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.minio.volumeSize | default "1Gi" | quote }}
      storageClassName: {{ .Values.minio.storageClass }}
      volumeMode: Filesystem

{{- end }}
