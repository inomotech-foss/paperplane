name: Test MCP

on:
  workflow_dispatch:
  # No branches filter: it matches the PR's base, so a stacked PR targeting
  # another feature branch would never run these.
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "reopened"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-mcp:
    name: Test MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'merge_group' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.x"
      - name: Install uv
        run: python -m pip install uv
      - name: Install MCP dependencies
        run: cd apps/mcp && uv sync --extra dev
      # test_integration.py needs a live Plane instance, so it is left out.
      - name: Run MCP tests
        run: cd apps/mcp && uv run pytest -q --ignore=tests/test_integration.py

