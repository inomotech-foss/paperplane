name: Test MCP

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-mcp:
    name: Test MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.x"
      - name: Install uv
        run: python -m pip install uv
      - name: Install MCP dependencies
        run: cd apps/mcp && uv sync --extra dev
      - name: Lint apps/mcp
        run: cd apps/mcp && uv run ruff check .
      - name: Check apps/mcp formatting
        run: cd apps/mcp && uv run ruff format --check .
      # test_integration.py needs a live Plane instance, so it is left out.
      - name: Run MCP tests
        run: cd apps/mcp && uv run pytest -q --ignore=tests/test_integration.py
