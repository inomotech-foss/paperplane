name: API types check

on:
  workflow_dispatch:
  pull_request:
    types:
      - "opened"
      - "synchronize"
      - "reopened"
      - "ready_for_review"
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated-check:
    name: check:api-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      DJANGO_SETTINGS_MODULE: plane.settings.production
      # Schema generation reads views and serializers only; nothing is contacted.
      SECRET_KEY: ci-api-types-check
      REDIS_URL: redis://127.0.0.1:6379/0
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.x"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements/*.txt"

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt

      - name: Regenerate the OpenAPI schemas
        working-directory: apps/api
        run: python manage.py generate_openapi

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @plane/api-types

      - name: Regenerate the TypeScript types
        run: pnpm --filter @plane/api-types run generate

      - name: Check the committed output is current
        run: |
          git status --porcelain -- apps/api/openapi packages/api-types/src/generated | tee stale-generated.txt
          if [ -s stale-generated.txt ]; then
            git diff --stat -- apps/api/openapi packages/api-types/src/generated
            echo "::error::Run 'python manage.py generate_openapi' in apps/api and 'pnpm --filter @plane/api-types run generate', then commit the result."
            exit 1
          fi
