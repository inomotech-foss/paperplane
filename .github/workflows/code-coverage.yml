name: Code Coverage

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/code-coverage.yml"
  workflow_call:

permissions:
  contents: read
  code-quality: write

concurrency:
  group: code-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API test coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare test env
        run: |
          cp apps/api/.env.example apps/api/.env
          echo 'SECRET_KEY="ci-coverage-secret-key"' >> apps/api/.env

      # Started early so the health checks overlap the build.
      - name: Start test services
        run: docker compose -f docker-compose-test.yml up -d test-db test-redis test-mq test-minio

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.dev
          tags: paperplane-api-tests:latest
          load: true
          cache-from: type=gha,scope=api-tests
          cache-to: type=gha,mode=max,scope=api-tests

      - name: Run test suite with coverage
        run: |
          docker compose -f docker-compose-test.yml run --rm api-tests \
            pytest -n auto --cov=plane --cov-report=xml:/code/coverage.xml

      - name: Rewrite coverage source to repo path
        if: ${{ !cancelled() }}
        run: |
          sed -i -E 's#<source>.*</source>#<source>apps/api</source>#' apps/api/coverage.xml

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-code-coverage@abb5995db9e0199b0e2bb9dbd136fce4cb1ec4d3 # v1.3.0
        with:
          file: apps/api/coverage.xml
          language: Python
          label: api
          # Best-effort: the Code Quality service is a preview and its ingestion
          # is timing/baseline-dependent. The `code_quality` ruleset rule gates
          # coverage; this job gates the tests, so don't fail it on upload errors.
          fail-on-error: false

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
